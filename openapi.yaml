        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------- Contractors ----------------
  /contractors:
    get:
      tags: [Contractors]
      summary: List contractors
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  contractors:
                    type: array
                    items: { $ref: '#/components/schemas/Contractor' }
    post:
      tags: [Contractors]
      summary: Create a contractor (Admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ContractorInput'
                - type: object
                  properties: { password: { type: string, format: password } }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties: { contractor: { $ref: '#/components/schemas/Contractor' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /contractors/{id}:
    put:
      tags: [Contractors]
      summary: Update a contractor (Admin only)
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContractorInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { contractor: { $ref: '#/components/schemas/Contractor' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Contractors]
      summary: Soft-delete a contractor (Admin only)
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        '204': { description: Deleted }
