openapi: 3.0.3
info:
  title: Archcorp DCC API
  description: |
    Document Control Center API for Archcorp — documents, review workflow,
    projects, schedules, employees/contractors/firms, snags, transmittals,
    notifications and lookups. Backed by Express + MSSQL.
  version: "1.0.0"
servers:
  - url: http://localhost:5500/api
    description: Local development
  - url: http://62.171.154.41:8099/api
    description: Production

tags:
  - name: Auth
    description: |
      **Session flow**
      1. Sign in with `POST /auth/login` (or `/auth/login/microsoft`, `/auth/login/dev`).
         The response has `token` (access, 12h), `refreshToken` (7d) and `user`.
      2. Send `Authorization: Bearer <token>` on every protected call.
      3. When a call returns **401**, call `POST /auth/refresh` with the stored `refreshToken`,
         save **both** new tokens (the refresh token is rotated), and retry the original call once.
      4. If `/auth/refresh` itself returns 401, the session is over. Clear the tokens and send the user back to sign-in.
  - name: Documents
  - name: Clients
  - name: Projects
  - name: Assignments
  - name: Distribution
  - name: Chat
  - name: Transmittals
  - name: Schedule Activities
  - name: Employees
  - name: Firms
  - name: Contractors
  - name: Workflow Templates
  - name: Email Log
  - name: Snags
  - name: Dues
  - name: Lookups
  - name: Notifications
  - name: ACC

security:
  - bearerAuth: []

paths:
  # ---------------- Auth ----------------
  /auth/login:
    post:
      tags: [Auth]
      summary: Log in with email + password (employee or contractor)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/login/dev:
    post:
      tags: [Auth]
      summary: Dev-only bypass login (enabled only when AUTH_DEV_BYPASS=true)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employeeId]
              properties:
                employeeId: { type: string }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { description: Not found (feature disabled, or employee not found / wrong role) }

  /auth/dev-options:
    get:
      tags: [Auth]
      summary: List Admin/Reviewer employees available for dev bypass login
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  employees:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        email: { type: string }
                        role: { type: string }
                        title: { type: string }
        '404': { description: Feature disabled }

  /auth/login/microsoft:
    post:
      tags: [Auth]
      summary: Log in via Microsoft Entra ID token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              properties:
                idToken: { type: string }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: No matching Archcorp DCC staff account for this email }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange a refresh token for a new access + refresh token pair
      description: >
        Re-reads the user from the DB, so role/profile changes apply and deactivated
        accounts are rejected. The refresh token is rotated — use the new one next time.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string, description: The refreshToken from the last login or refresh response }
            example:
              refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        '200':
          description: Session refreshed. Replace both stored tokens with these.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                user: { id: e_06394dd5, role: Reviewer, name: Rhea Fernandes, email: rhea.fernandes@archcorp.ae, disc: Structure, title: Senior Reviewer }
        '400':
          description: refreshToken missing from the body
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: refreshToken is required }
        '401':
          description: Refresh token invalid or expired, or the account was deactivated. The user must sign in again.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                invalid: { value: { error: Invalid or expired refresh token } }
                inactive: { value: { error: Account no longer active } }

  /auth/me:
    get:
      tags: [Auth]
      summary: Get the current authenticated user (from the JWT)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/AuthUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------------- Documents ----------------
  /documents:
    get:
      tags: [Documents]
      summary: List all documents
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  documents:
                    type: array
                    items: { $ref: '#/components/schemas/Document' }
    post:
      tags: [Documents]
      summary: Create (submit) a new document, optionally with an attached file
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [project, type, title, discipline, firm, reviewer]
              properties:
                project: { type: string, description: Project id }
                type: { type: string, description: Document type id }
                title: { type: string }
                discipline: { type: string }
                firm: { type: string, description: Firm id }
                reviewer: { type: string, description: Reviewer employee id }
                priority: { type: string }
                originator: { type: string }
                functional: { type: string }
                spatial: { type: string }
                form: { type: string }
                discCode: { type: string }
                reasonForIssue: { type: string }
                remarks: { type: string, description: Optional first comment on the thread }
                file:
                  type: string
                  format: binary
                  description: Optional source file (up to 50MB). A placeholder PDF is generated if omitted.
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  document: { $ref: '#/components/schemas/Document' }
                  historyEntries:
                    type: array
                    items: { $ref: '#/components/schemas/HistoryEntry' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /documents/{id}/file:
    get:
      tags: [Documents]
      summary: Proxy-download a document's stored file (in or out)
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - name: which
          in: query
          schema: { type: string, enum: [in, out], default: in }
      responses:
        '200':
          description: File bytes (Content-Type mirrors the stored file)
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { description: Could not fetch source file from storage }

  /documents/{id}/comments:
    post:
      tags: [Documents]
      summary: Add a comment or snag to a document's thread
      parameters: [ $ref: '#/components/parameters/DocumentId' ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [txt]
              properties:
                txt: { type: string }
                isSnag: { type: boolean, default: false }
                loc:
                  type: object
                  properties: { x: { type: number }, y: { type: number } }
                page: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  document: { $ref: '#/components/schemas/Document' }
                  historyEntries:
                    type: array
                    items: { $ref: '#/components/schemas/HistoryEntry' }
        '404': { $ref: '#/components/responses/NotFound' }

  /documents/{id}/replies:
    post:
      tags: [Documents]
      summary: Reply to a thread item
      parameters: [ $ref: '#/components/parameters/DocumentId' ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parentIndex, txt]
              properties:
                parentIndex: { type: integer }
                txt: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  document: { $ref: '#/components/schemas/Document' }
        '404': { $ref: '#/components/responses/NotFound' }

  /documents/{id}/thread/{seqIndex}/toggle:
    post:
      tags: [Documents]
      summary: Toggle a thread item's status between open and resolved
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - name: seqIndex
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  document: { $ref: '#/components/schemas/Document' }
                  status: { type: string, enum: [open, resolved] }
        '404': { $ref: '#/components/responses/NotFound' }

  /documents/{id}/review:
    post:
      tags: [Documents]
      summary: Record a review decision for a document (advances/sets status)
      parameters: [ $ref: '#/components/parameters/DocumentId' ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, description: One of the configured DccStatuses names }
                narration: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  document: { $ref: '#/components/schemas/Document' }
                  historyEntries:
                    type: array
                    items: { $ref: '#/components/schemas/HistoryEntry' }
        '404': { $ref: '#/components/responses/NotFound' }

  /documents/{id}/resubmit:
    post:
      tags: [Documents]
      summary: Resubmit a document (bumps round, resets to Submitted/In-Process)
      parameters: [ $ref: '#/components/parameters/DocumentId' ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  document: { $ref: '#/components/schemas/Document' }
                  historyEntries:
                    type: array
                    items: { $ref: '#/components/schemas/HistoryEntry' }
        '404': { $ref: '#/components/responses/NotFound' }

  /documents/{id}/mode:
    post:
      tags: [Documents]
      summary: Switch a document's viewer mode between review and snagging
      parameters: [ $ref: '#/components/parameters/DocumentId' ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { type: string, enum: [review, snagging] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  document: { $ref: '#/components/schemas/Document' }
                  historyEntries:
                    type: array
                    items: { $ref: '#/components/schemas/HistoryEntry' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /documents/{id}/member-review:
    post:
      tags: [Documents]
      summary: Record one reviewer's individual verdict (endorse/object/comment)
      parameters: [ $ref: '#/components/parameters/DocumentId' ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verdict]
              properties:
                verdict: { type: string, enum: [endorse, object, comment] }
                comment: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  document: { $ref: '#/components/schemas/Document' }
                  historyEntries:
                    type: array
                    items: { $ref: '#/components/schemas/HistoryEntry' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /documents/{id}/markups:
    put:
      tags: [Documents]
      summary: Replace the full markup annotation set for a document
      parameters: [ $ref: '#/components/parameters/DocumentId' ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [marks]
              properties:
                marks: { type: array, items: {} }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  marks: { type: array, items: {} }
                  historyEntries:
                    type: array
                    items: { $ref: '#/components/schemas/HistoryEntry' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /documents/{id}/notify:
    post:
      tags: [Documents]
      summary: Notify the project team about this document (in-app notification + AI chat message)
      parameters: [ $ref: '#/components/parameters/DocumentId' ]
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  notification: { $ref: '#/components/schemas/Notification' }
                  message: { $ref: '#/components/schemas/ChatMessage' }
                  historyEntries:
                    type: array
                    items: { $ref: '#/components/schemas/HistoryEntry' }
        '404': { $ref: '#/components/responses/NotFound' }

  /documents/{id}/follow-up:
    post:
      tags: [Documents]
      summary: Send a follow-up on a document
      parameters: [ $ref: '#/components/parameters/DocumentId' ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                summary: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  notification: { $ref: '#/components/schemas/Notification' }
                  message: { $ref: '#/components/schemas/ChatMessage' }
                  historyEntries:
                    type: array
                    items: { $ref: '#/components/schemas/HistoryEntry' }
        '404': { $ref: '#/components/responses/NotFound' }

  /documents/{id}/email-log:
    post:
      tags: [Documents]
      summary: Send and log a transmittal-style status email to the submitter
      parameters: [ $ref: '#/components/parameters/DocumentId' ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string }
                narration: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  email: { $ref: '#/components/schemas/EmailLogEntry' }
                  delivered: { type: boolean }
                  deliveryError: { type: string, nullable: true }
        '404': { $ref: '#/components/responses/NotFound' }

  /markups:
    get:
      tags: [Documents]
      summary: Get markups for all documents, keyed by document id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  markups:
                    type: object
                    additionalProperties:
                      type: array
                      items: {}

  /history:
    get:
      tags: [Documents]
      summary: List all document history entries
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  history:
                    type: array
                    items: { $ref: '#/components/schemas/HistoryEntry' }

  # ---------------- Clients ----------------
  /clients:
    get:
      tags: [Clients]
      summary: List clients
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  clients:
                    type: array
                    items: { $ref: '#/components/schemas/Client' }
    post:
      tags: [Clients]
      summary: Create a client (Admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties: { client: { $ref: '#/components/schemas/Client' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /clients/{id}:
    put:
      tags: [Clients]
      summary: Update a client (Admin only)
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { client: { $ref: '#/components/schemas/Client' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Clients]
      summary: Soft-delete a client (Admin only)
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------- Projects ----------------
  /projects:
    get:
      tags: [Projects]
      summary: List projects
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items: { $ref: '#/components/schemas/Project' }
    post:
      tags: [Projects]
      summary: Create a project (Admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties: { project: { $ref: '#/components/schemas/Project' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /projects/{id}:
    put:
      tags: [Projects]
      summary: Update a project's core fields (Admin only)
      parameters: [ $ref: '#/components/parameters/ProjectId' ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { project: { $ref: '#/components/schemas/Project' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Projects]
      summary: Soft-delete a project (Admin only)
      parameters: [ $ref: '#/components/parameters/ProjectId' ]
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{id}/config:
    post:
      tags: [Projects]
      summary: Partially update a project's workflow/numbering/enrichment config (Admin only)
      parameters: [ $ref: '#/components/parameters/ProjectId' ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                workflow: { type: string }
                disciplines: { type: array, items: { type: string } }
                categories: { type: array, items: { type: string } }
                numbering: { type: string }
                numberingConfig: { type: object }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { project: { $ref: '#/components/schemas/Project' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{id}/team:
    post:
      tags: [Assignments]
      summary: Add a person to a project team (Admin only)
      parameters: [ $ref: '#/components/parameters/ProjectId' ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [personId, type]
              properties:
                personId: { type: string }
                type: { type: string, enum: [internal, contractor] }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  project: { type: string }
                  a: { type: string }
                  t: { type: string, enum: [internal, contractor] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /projects/{id}/team/{personId}:
    delete:
      tags: [Assignments]
      summary: Remove a person from a project team (Admin only)
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: personId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Removed }
        '403': { $ref: '#/components/responses/Forbidden' }

  /assignments:
    get:
      tags: [Assignments]
      summary: List all project team assignments, keyed by project id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  assignments:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: object
                        properties:
                          a: { type: string }
                          t: { type: string, enum: [internal, contractor] }

  /distribution:
    get:
      tags: [Distribution]
      summary: List distribution matrix rows for all projects, keyed by project id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  distribution:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: object
                        properties:
                          disc: { type: string }
                          reviewer: { type: string }
                          action: { type: string }

  /projects/{id}/distribution:
    post:
      tags: [Distribution]
      summary: Add a distribution matrix row to a project (Admin only)
      parameters: [ $ref: '#/components/parameters/ProjectId' ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [disc, reviewer, action]
              properties:
                disc: { type: string }
                reviewer: { type: string }
                action: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  row:
                    type: object
                    properties:
                      disc: { type: string }
                      reviewer: { type: string }
                      action: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /projects/{id}/chat:
    post:
      tags: [Chat]
      summary: Post a chat message to a project's channel
      parameters: [ $ref: '#/components/parameters/ProjectId' ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
                kind: { type: string, enum: [msg, ai], default: msg }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties: { message: { $ref: '#/components/schemas/ChatMessage' } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /chats:
    get:
      tags: [Chat]
      summary: List chat messages for all projects, keyed by project id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  chats:
                    type: object
                    additionalProperties:
                      type: array
                      items: { $ref: '#/components/schemas/ChatMessage' }

  /projects/{id}/transmittals:
    post:
      tags: [Transmittals]
      summary: Issue a transmittal for one or more documents on a project
      parameters: [ $ref: '#/components/parameters/ProjectId' ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose, to, docs]
              properties:
                purpose: { type: string }
                to: { type: array, items: { type: string }, description: Recipient emails }
                docs: { type: array, items: { type: string }, description: Document ids }
                remarks: { type: string }
                mailType: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  transmittal: { $ref: '#/components/schemas/Transmittal' }
                  historyEntries:
                    type: array
                    items: { $ref: '#/components/schemas/HistoryEntry' }
                  emails:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/EmailLogEntry'
                        - type: object
                          properties: { delivered: { type: boolean } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /transmittals:
    get:
      tags: [Transmittals]
