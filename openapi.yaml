          content:
            application/json:
              schema:
                type: object
                properties: { firm: { $ref: '#/components/schemas/Firm' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /firms/{id}:
    put:
      tags: [Firms]
      summary: Update a firm (Admin only)
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FirmInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { firm: { $ref: '#/components/schemas/Firm' } }
        '403': { $ref: '#/components/responses/Forbidden' }
