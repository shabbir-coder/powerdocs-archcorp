      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties: { password: { type: string, format: password, minLength: 6 } }
      responses:
        '204': { description: Updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------- Workflow Templates ----------------
  /workflowtemplates:
    get:
      tags: [Workflow Templates]
      summary: List workflow templates
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  workflowTemplates:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                      additionalProperties: true

  # ---------------- Email Log ----------------
  /emails:
    get:
      tags: [Email Log]
      summary: List sent/logged emails
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  emails:
                    type: array
                    items: { $ref: '#/components/schemas/EmailLogEntry' }

  # ---------------- Snags ----------------
  /snags:
    get:
      tags: [Snags]
      summary: List snags
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  snags:
                    type: array
                    items: { $ref: '#/components/schemas/Snag' }
    post:
      tags: [Snags]
      summary: Raise a new snag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project, discipline, desc, priority, assignedTo]
              properties:
                project: { type: string }
                discipline: { type: string }
                location: { type: string }
                desc: { type: string }
                priority: { type: string }
                assignedTo: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties: { snag: { $ref: '#/components/schemas/Snag' } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /snags/status/{id}:
    post:
      tags: [Snags]
      summary: Update a snag's status
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties: { status: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { snag: { $ref: '#/components/schemas/Snag' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------- Dues ----------------
  /dues:
    get:
      tags: [Dues]
      summary: List dues (invoices/payments)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  dues:
                    type: array
                    items: { $ref: '#/components/schemas/Due' }

  # ---------------- Lookups ----------------
  /lookups:
    get:
      tags: [Lookups]
      summary: Get the full lookup bundle (all lookup types at once)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  disciplines: { type: array, items: { $ref: '#/components/schemas/LookupItem' } }
                  departments: { type: array, items: { $ref: '#/components/schemas/LookupItem' } }
                  categories: { type: array, items: { $ref: '#/components/schemas/LookupItem' } }
                  priorities: { type: array, items: { $ref: '#/components/schemas/LookupItem' } }
                  reviewCodes: { type: array, items: { $ref: '#/components/schemas/LookupItem' } }
                  docTypes: { type: array, items: { $ref: '#/components/schemas/DocType' } }
                  statuses: { type: array, items: { $ref: '#/components/schemas/StatusLookup' } }

  /lookups/{type}:
    get:
      tags: [Lookups]
      summary: List lookup values of one type
      parameters: [ $ref: '#/components/parameters/LookupType' ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties: { docTypes: { type: array, items: { $ref: '#/components/schemas/DocType' } } }
                  - type: object
                    properties: { statuses: { type: array, items: { $ref: '#/components/schemas/StatusLookup' } } }
                  - type: object
                    properties: { items: { type: array, items: { $ref: '#/components/schemas/LookupItem' } } }
        '400': { description: Unknown lookup type }
    post:
      tags: [Lookups]
      summary: Create a lookup value of one type (Admin only)
      parameters: [ $ref: '#/components/parameters/LookupType' ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/DocTypeInput'
                - $ref: '#/components/schemas/StatusInput'
                - $ref: '#/components/schemas/LookupItemInput'
      responses:
        '201':
          description: Created
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /lookups/{type}/{id}:
    put:
      tags: [Lookups]
      summary: Update a lookup value (Admin only)
      parameters:
        - $ref: '#/components/parameters/LookupType'
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/DocTypeInput'
                - $ref: '#/components/schemas/StatusInput'
                - $ref: '#/components/schemas/LookupItemInput'
      responses:
        '200': { description: OK }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Lookups]
      summary: Delete a lookup value (Admin only)
      parameters:
        - $ref: '#/components/parameters/LookupType'
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------- Notifications ----------------
  /notifications:
    get:
      tags: [Notifications]
      summary: List all notifications
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  notifications:
                    type: array
                    items: { $ref: '#/components/schemas/Notification' }

  /notifications/read:
    post:
      tags: [Notifications]
      summary: Mark the current user's notifications as read (Admins mark all)
      responses:
        '204': { description: Updated }

  # ---------------- ACC ----------------
  /acc/projects:
    get:
      tags: [ACC]
      summary: Proxy Autodesk Construction Cloud projects feed
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects: { type: array, items: {} }
        '502': { description: Could not reach the ACC projects feed }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Obtain via POST /auth/login (or /auth/login/microsoft, /auth/login/dev).
        Send as `Authorization: Bearer <token>`. Expires in 12h; renew via POST /auth/refresh.

  parameters:
    DocumentId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: Document id
    ProjectId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: Project id
    LookupType:
      name: type
      in: path
      required: true
      schema:
        type: string
        enum: [disciplines, departments, categories, priorities, review-codes, doc-types, statuses]

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated but not permitted (role check failed)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }

    AuthUser:
      type: object
      properties:
        id: { type: string }
        role: { type: string, enum: [Admin, Reviewer, Contractor] }
        name: { type: string }
        email: { type: string }
        disc: { type: string, nullable: true }
        firm: { type: string, nullable: true }

    LoginResponse:
      type: object
      properties:
        token: { type: string, description: JWT access token, valid 12h (JWT_EXPIRES_IN) }
        refreshToken: { type: string, description: JWT refresh token for POST /auth/refresh, valid 7d (JWT_REFRESH_EXPIRES_IN) }
        user: { $ref: '#/components/schemas/AuthUser' }

    HistoryEntry:
      type: object
      properties:
        id: { type: string }
        doc: { type: string }
        project: { type: string }
        at: { type: string, format: date-time }
        action: { type: string }
        actor: { type: string }
        role: { type: string }
        round: { type: integer }
        comment: { type: string, nullable: true }

    ThreadItem:
      type: object
      properties:
        id: { type: string }
        by: { type: string }
        role: { type: string }
        type: { type: string, enum: [comment, snag, reply] }
        loc:
          type: object
          nullable: true
          properties: { x: { type: number }, y: { type: number } }
        page: { type: integer, nullable: true }
        status: { type: string, enum: [open, resolved], nullable: true }
        txt: { type: string }
        parent: { type: integer, nullable: true }
        at: { type: string, format: date-time }

    RevisionEntry:
      type: object
      properties:
        rev: { type: integer }
        date: { type: string, format: date-time }
        status: { type: string }
        file:
          type: object
          nullable: true
          properties:
            name: { type: string }
            ver: { type: integer }
            size: { type: integer }
            url: { type: string }
        current: { type: boolean }

    FileRef:
      type: object
      nullable: true
      properties:
        name: { type: string }
        ver: { type: integer }
        size: { type: integer }
        url: { type: string }

    MemberReview:
      type: object
      properties:
        by: { type: string }
        at: { type: string, format: date-time }
        verdict: { type: string, enum: [endorse, object, comment] }
        comment: { type: string, nullable: true }

    Document:
      type: object
      properties:
        id: { type: string }
        ref: { type: string }
        project: { type: string }
        type: { type: string }
        title: { type: string }
        disciplines: { type: array, items: { type: string } }
        firm: { type: string }
        submittedBy: { type: string }
        reviewers: { type: array, items: { type: string } }
        status: { type: string }
        flow: { type: string, enum: [In-Process, Completed] }
        priority: { type: string }
        round: { type: integer }
        category: { type: string }
        dueDays: { type: integer }
        created: { type: string, format: date-time }
        updated: { type: string, format: date-time }
        storage: { type: string }
        inFile: { $ref: '#/components/schemas/FileRef' }
        outFile: { $ref: '#/components/schemas/FileRef' }
        thread: { type: array, items: { $ref: '#/components/schemas/ThreadItem' } }
        activity: { type: string, nullable: true, description: Linked schedule activity id }
        leadDays: { type: integer, nullable: true }
        material: { type: string, nullable: true }
        qty: { type: number, nullable: true }
        mode: { type: string, enum: [review, snagging] }
        memberReviews: { type: array, items: { $ref: '#/components/schemas/MemberReview' } }
        docNo: { type: string, nullable: true }
        originator: { type: string, nullable: true }
        functional: { type: string, nullable: true }
        spatial: { type: string, nullable: true }
        form: { type: string, nullable: true }
        discCode: { type: string, nullable: true }
        stageCode: { type: string, nullable: true }
        stage: { type: string, nullable: true }
        reasonForIssue: { type: string, nullable: true }
        createdByOrg: { type: string, nullable: true }
        revisions: { type: array, items: { $ref: '#/components/schemas/RevisionEntry' } }

    Client:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        code: { type: string }
        city: { type: string }
    ClientInput:
      type: object
      required: [name, code, city]
      properties:
        name: { type: string }
        code: { type: string }
        city: { type: string }

    Project:
      type: object
      properties:
        id: { type: string }
        pid: { type: string }
        name: { type: string }
        client: { type: string }
        city: { type: string }
        status: { type: string }
        start: { type: string, format: date }
        workflow: { type: string, nullable: true }
        disciplines: { type: array, items: { type: string }, nullable: true }
        categories: { type: array, items: { type: string }, nullable: true }
        numbering: { type: string, nullable: true }
        numberingConfig: { type: object, nullable: true }
        accId: { type: string, nullable: true }
    ProjectInput:
      type: object
      required: [pid, name, client, city, status, start]
      properties:
        pid: { type: string }
        name: { type: string }
        client: { type: string }
        city: { type: string }
        status: { type: string }
        start: { type: string, format: date }
        workflow: { type: string }
        disciplines: { type: array, items: { type: string } }
